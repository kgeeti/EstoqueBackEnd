    <script>
        
        async function carregaProdutos() {
                try {
                    const res = await fetch('/estoque/produtos');
                    const produtos = await res.json();

                    const html = produtos.map(item => `
                        
                    <tr>
                        <td style="font-weight: 500; color: #fff;">${item.nome}</td>
                        <td><span class="badge">${item.categoria.categoria}</span></td>
                        <td>${item.saldo}</td>
                        <td>${item.valorUnitario}</td>
                        <td class="total-value">${(item.valorUnitario * item.saldo)}</td>
                        <td>
                            <div class="actions" style="justify-content: center;">
                                <button class="action-btn edit" title="Editar"><i class="fa-regular fa-pen-to-square"></i></button>
                                <button class="action-btn report" title="Relatório"><i class="fa-regular fa-file-lines"></i></button>
                                <button class="action-btn delete" title="Excluir"><i class="fa-regular fa-trash-can"></i></button>
                            </div>
                        </td>
                    </tr>
                    `).join('');
            
                    document.getElementById("corpoTabela").innerHTML = html;

                } catch (erro) {
                    console.error('Erro na requisição:', erro);
                }
            }

            carregaProdutos();
        
    </script>
