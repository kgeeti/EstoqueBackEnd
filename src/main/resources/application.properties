spring.application.name=estoque

# Define cores no terminal
spring.output.ansi.enabled=always

# Define path raiz do endpoint
# http://localhost:8080/raiz_do_endpoint/algumacoisa
server.servlet.context-path=/estoque

# ---------------------------------------
# Defini\u00e7\u00e3o de ambiente de execu\u00e7\u00e3o
# ---------------------------------------

spring.profiles.active=${APP_ENVIRONMENT:test}
#spring.profiles.active=test
#spring.profiles.active=prod
#spring.profiles.active=prodVercel

# Defini\u00e7\u00e3o de Porta
# Procura uma variavel de ambiente SERVER_PORT. Caso n\u00e3o exista utiliza
# a porta 8080 como default.
server.port=${SERVER_PORT:8080}

